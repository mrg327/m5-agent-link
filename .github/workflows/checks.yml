name: checks

# Repository-wide checks that are not tied to one component: formatting for every language
# (scripts/check.d/format.sh), the structure rules, commit messages since the cutoff, and the
# Markdown and doc-coverage checks.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-docs:
    name: format and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit-message check walks history back to its cutoff
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting, structure, commit messages and docs
        run: scripts/check format structure commits docs
      - name: Install simulator dependencies (clang-tidy reads its compile database)
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build
      - name: C, Python and JS linters against their baselines
        run: scripts/check lint
