name: simulator

on:
  push:
    branches: [main]
    paths:
      - "simulator/**"
      - "firmware/components/**"
      - "protocol/**"
      - ".github/workflows/simulator.yml"
  pull_request:
    paths:
      - "simulator/**"
      - "firmware/components/**"
      - "protocol/**"
      - ".github/workflows/simulator.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 ninja
      - name: Configure
        run: cmake -S simulator -B build/sim -G Ninja
      - name: Build
        run: cmake --build build/sim
      - name: Test
        run: ctest --test-dir build/sim -j 16 --output-on-failure
