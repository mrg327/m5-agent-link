name: daemon

on:
  push:
    branches: [main]
    paths: ["daemon/**", "protocol/**", ".github/workflows/daemon.yml"]
  pull_request:
    paths: ["daemon/**", "protocol/**", ".github/workflows/daemon.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      # The commands of `scripts/check daemon`, run directly: that area also runs the pi step,
      # which has its own job below, and this matrix includes Windows. Formatting (cargo fmt
      # --check) runs in checks.yml as part of `scripts/check format`.
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  pi-extension:
    name: pi extension (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # runs .ts without flags (so does 22.18 and newer)
      - run: node --test daemon/integrations/pi/*.test.ts
