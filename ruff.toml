# Ruff config for the repository's Python tools. docs/conventions/python.md
# Run as `uvx ruff@0.17.6 format` / `uvx ruff@0.17.6 check` (or `scripts/check python`).
required-version = "==0.17.6"
line-length = 100
target-version = "py311"
extend-exclude = [
  "firmware/managed_components",
  "firmware/build-*",
  "**/build",
  "**/node_modules",
  "atlas/vendor",
]

[format]
quote-style = "double"
docstring-code-format = true

[lint]
# Phase 1: syntax and undefined-name errors only.
# Planned (python.md PY-2): "E4", "E7", "E9", "F" blocking everywhere, then the full set
# "E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "C4", "BLE", "RUF", "PLW1510" with a baseline,
# ignore D105 and D107, pydocstyle convention "google".
select = ["E9", "F63", "F7", "F82"]
