[workspace]
resolver = "2"
members = [
    "crates/agentlink-proto",
    "crates/agentlinkd",
    "crates/agentlink-hook",
    "crates/agentlink",
    "crates/agentlink-keys",
    "crates/agentlink-delta",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
agentlink-proto = { path = "crates/agentlink-proto" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
minicbor = { version = "2", features = ["derive", "alloc", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
tokio-tungstenite = "0.30"
tokio-serial = "5.4"
btleplug = "0.13"
uuid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The daemon on a development machine runs the dev build as a service (README). Our own crates stay
# unoptimised and debuggable; what is hot or not ours is optimised: the swipe decoder is ~20x slower at
# opt-level 0 (its accuracy gate took 10-30 s and timed out under load, issue 5617), and CBOR, BLE and
# the async runtime are third-party code nobody steps through.
[profile.dev.package.agentlink-keys]
opt-level = 3

# Making a firmware patch (bsdiff over a 1.3 MB image) takes seconds even optimised.
[profile.dev.package.agentlink-delta]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
