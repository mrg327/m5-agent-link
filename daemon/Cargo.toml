[workspace]
resolver = "2"
members = [
    "crates/agentlink-proto",
    "crates/agentlinkd",
    "crates/agentlink-hook",
    "crates/agentlink",
    "crates/agentlink-keys",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
agentlink-proto = { path = "crates/agentlink-proto" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
minicbor = { version = "2", features = ["derive", "alloc", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
tokio-tungstenite = "0.30"
tokio-serial = "5.4"
btleplug = "0.13"
uuid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
